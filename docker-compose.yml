version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: skymed
    ports:
      - "5432:5432"
  api:
    build: ./apps/api
    ports:
      - "4000:4000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/skymed
  web:
    build: ./apps/web
    ports:
      - "3000:3000"
